name: Python CI CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Build, test and package
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest -v

      - name: Package application
        run: |
          mkdir -p dist
          cp app.py test_app.py dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: dist/

  # Job 2: Deploy to staging
  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: dist/

      - name: Deploy to Staging
        run: echo "Deploying Python application to Staging..."

  # Job 3: Deploy to production
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: dist/

      - name: Deploy to Production
        run: echo "Deploying Python application to Production..."